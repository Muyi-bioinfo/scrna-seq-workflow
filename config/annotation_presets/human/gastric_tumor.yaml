# ============================================================
# human/gastric_tumor — 人胃癌组织主要细胞类型 marker 预设
# ============================================================

description: 人胃癌组织主要细胞类型 marker（上皮 + 免疫 + 基质）
tissue: stomach (gastric tumor)
species: human
source: 人工核查自《单细胞分析中常见marker基因汇总》（胃癌表）
        + 修正记录：NK 剔 AREG/HSPA6（文献特异差异基因，非经典 marker）；
        成纤维补 DCN/GSN（经典成纤维 marker，与经典表一致）
version: 2026-08-21

celltypes:
  "Epithelial":
    markers:
      tier1: [EPCAM, KRT19, CLDN4]
      tier2: []
    aliases: ["上皮", "Epithelial cell"]

  "T cell":
    markers:
      tier1: [CD3D, CD3E, CD8A, CD4]
      tier2: [CD2]
    aliases: ["T 细胞"]

  "Endothelial":
    markers:
      tier1: [CDH5, PECAM1, VWF]
      tier2: []
    aliases: ["内皮", "内皮细胞"]

  "Fibroblast":
    markers:
      tier1: [LUM, FGF7, MME, DCN, GSN]
      tier2: []
    aliases: ["成纤维", "成纤维细胞"]

  "Macrophage":
    markers:
      tier1: [AIF1, C1QC, C1QB, LYZ]
      tier2: []
    aliases: ["巨噬", "巨噬细胞"]

  "B cell":
    markers:
      tier1: [MS4A1, CD19, CD79A]
      tier2: [IGHG1, MZB1, SDC1]
    aliases: ["B 细胞"]

  "NK":
    markers:
      tier1: [KLRD1, GNLY, KLRF1]
      tier2: [XCL2]
    aliases: ["NK 细胞"]

  "Mast cell":
    markers:
      tier1: [CPA3, CST3, KIT]
      tier2: [TPSAB1, TPSB2]
    aliases: ["肥大细胞"]
