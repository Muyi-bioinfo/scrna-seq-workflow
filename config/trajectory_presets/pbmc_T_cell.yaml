description: "T 细胞谱系：naive → memory → activated 的连续激活分化轨迹"
root_celltype: CD4 Naive T        # 起点：naive T 是激活过程的共同祖先状态
subset_celltypes:
  - CD4 Naive T
  - CD4 Memory T
  - T activated
  - CD8 T
